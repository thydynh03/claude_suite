name: Automatic Build & Release

# Build the full desktop app only when a version tag is pushed (or manually),
# NOT on every master push — a full Wails build is slow and was running on each commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test ./... -count=1

      - name: Go Test (race, TUI)
        run: go test -race ./backend/tui ./cmd/claude-suite-tui

      - name: Build TUI for Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/ClaudeSuiteTUI.exe ./cmd/claude-suite-tui

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Type Check
        working-directory: ./frontend
        run: npm run check

  build-and-release:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI binary
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: wails-cli-${{ runner.os }}-v2.13.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Wails App
        run: |
          wails build -platform windows/amd64 -clean

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSuite-Windows
          path: build/bin/ClaudeSuite.exe

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ClaudeSuite.exe
          name: Release ${{ github.ref_name }}
          body: |
            Tự động đóng gói bản cập nhật mới ${{ github.ref_name }} (Claude Suite Control Center).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
