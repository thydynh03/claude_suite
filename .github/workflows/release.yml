name: Automatic Build & Release

# Build the full desktop app only when a version tag is pushed (or manually),
# NOT on every master push — a full Wails build is slow and was running on each commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Scoped like ci.yml, and for the same reason: the repo root embeds
      # frontend/dist, which does not exist until the frontend is built. This job
      # never builds it, so ./... cannot compile here.
      - name: Go Vet
        run: go vet ./backend/... ./cmd/...

      - name: Go Test
        run: go test ./backend/... ./cmd/... -count=1

      - name: Go Test (race, TUI)
        run: go test -race ./backend/tui ./cmd/claude-suite-tui

      - name: Build TUI for Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/ClaudeSuiteTUI.exe ./cmd/claude-suite-tui

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Type Check
        working-directory: ./frontend
        run: npm run check

  build-and-release:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI binary
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: wails-cli-${{ runner.os }}-v2.13.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # NSIS is not on the windows-latest image. Wails only warns when makensis
      # is missing — "Cannot create installer: makensis not found" — and still
      # exits 0, so without this the job goes green and publishes the bare
      # executable exactly as before.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Confirm makensis is on PATH
        shell: pwsh
        run: makensis /VERSION

      # The tag is the single source of truth for the version. Without this the
      # binary reports whatever the default in version.go happens to be, which is
      # why every release kept calling itself v2.8.0.
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $tag"

      # -nsis produces an installer alongside the bare binary. Without it the
      # release is a loose .exe: nothing puts it in Program Files, nothing adds a
      # Start menu entry, and nothing registers an uninstaller, so it never looks
      # like an installed application. NSIS ships on the windows-latest image.
      # The companion tools have to exist before NSIS runs, because the installer
      # script picks them up out of build/bin. -clean wipes that directory, so
      # they are built after the app rather than before it.
      - name: Build Production Wails App + Installer
        run: |
          wails build -platform windows/amd64 -clean -ldflags "-X claude_suite/backend/version.BuildVersion=${{ steps.ver.outputs.tag }}"
          go build -o build/bin/claude-suite-claim.exe ./cmd/claude-suite-claim
          go build -o build/bin/claude-suite-tui.exe ./cmd/claude-suite-tui
          wails build -platform windows/amd64 -nsis -ldflags "-X claude_suite/backend/version.BuildVersion=${{ steps.ver.outputs.tag }}"

      - name: Verify the companion tools were packaged
        shell: pwsh
        run: |
          foreach ($tool in 'claude-suite-claim.exe','claude-suite-tui.exe') {
            if (-not (Test-Path "build/bin/$tool")) {
              Write-Error "$tool missing from build/bin — the installer would ship without it"
              exit 1
            }
          }

      - name: Verify the installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/bin -Filter *installer*.exe -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "No installer in build/bin — is makensis missing from the runner image?"
            exit 1
          }
          Write-Host "Installer: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

      # Checking build/bin is not enough: NSIS `File` resolves relative paths from
      # makensis's working directory, and the first version of this silently
      # produced an installer with none of the tools in it. 7-Zip reads an NSIS
      # archive, so this asserts what the user will actually unpack.
      - name: The installer really contains the companion tools
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build/bin -Filter *installer*.exe | Select-Object -First 1).FullName
          $listing = & 7z l $installer 2>$null | Out-String
          foreach ($tool in 'claude-suite-claim.exe','claude-suite-tui.exe','ClaudeSuite.exe') {
            if ($listing -notmatch [regex]::Escape($tool)) {
              Write-Error "$tool is not inside the installer"
              exit 1
            }
            Write-Host "packaged: $tool"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSuite-Windows
          path: |
            build/bin/ClaudeSuite.exe
            build/bin/*installer*.exe
            build/bin/claude-suite-claim.exe
            build/bin/claude-suite-tui.exe

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*installer*.exe
            build/bin/ClaudeSuite.exe
            build/bin/claude-suite-claim.exe
            build/bin/claude-suite-tui.exe
          name: Release ${{ github.ref_name }}
          body: |
            Claude Suite ${{ github.ref_name }}

            **Cài đặt:** tải file `*-installer.exe` và chạy. App sẽ xuất hiện
            trong Start menu và gỡ được qua Apps & features như mọi ứng dụng khác.

            `ClaudeSuite.exe` là bản chạy thẳng không cần cài, dành cho ai muốn
            mang theo USB — nó không tạo shortcut và không tự cập nhật.

            Bản cài đặt kèm luôn hai công cụ dòng lệnh, đặt cạnh app:
            `claude-suite-claim` (agent của đồng đội dùng để nộp claim — lệnh mà
            app đưa cho bạn đã trỏ sẵn đường dẫn này) và `claude-suite-tui`
            (giao diện terminal). Không cần cài Go hay build gì thêm.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
