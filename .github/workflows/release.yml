name: Automatic Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test ./... -count=1

      - name: Go Test (race, TUI)
        run: go test -race ./backend/tui ./cmd/claude-suite-tui

      - name: Build TUI for Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/ClaudeSuiteTUI.exe ./cmd/claude-suite-tui

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Type Check
        working-directory: ./frontend
        run: npm run check

  build-and-release:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Wails App
        run: |
          wails build -platform windows/amd64 -clean

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSuite-Windows
          path: build/bin/ClaudeSuite.exe

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ClaudeSuite.exe
          name: Release ${{ github.ref_name }}
          body: |
            Tự động đóng gói bản cập nhật mới ${{ github.ref_name }} (Claude Suite Control Center).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
