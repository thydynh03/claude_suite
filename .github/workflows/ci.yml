name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go build & test (Windows)
    # Windows is the shipping platform: the CLI runners set Windows-only
    # syscall.SysProcAttr fields, and process_other.go covers everything else.
    # SQLite uses modernc.org/sqlite (pure Go), so no CGO/gcc is required here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # ./cmd/... is included but the repo root is not: main.go embeds
      # frontend/dist, which does not exist until the frontend job has built it.
      - name: Build
        run: go build ./backend/... ./cmd/...
      - name: Vet
        run: go vet ./backend/... ./cmd/...
      - name: Test
        run: go test ./backend/... ./cmd/...

  race:
    name: Race detector (Linux)
    # The race detector needs CGO, which Windows developer machines rarely have.
    # backend/cli/process_other.go provides the non-Windows process variant, so
    # the whole backend compiles here — this is the only place data races in the
    # orchestrator's per-task goroutines can actually be caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./backend/... ./cmd/...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # svelte-check catches type errors in .svelte files that vite build happily
      # ignores — including bindings drifting out of sync with the Go source.
      - name: Type check
        run: npm run check
      # Stores and utilities carry real logic — log buffering, per-task routing,
      # toast lifetimes, cost estimates — and a type check does not exercise any
      # of it.
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  desktop:
    name: Desktop app build
    # The only job that compiles the repository root, and so the only one that
    # can catch a break in app.go, in the //go:embed of frontend/dist, or in
    # bindings that no longer match the Go source. Everything else deliberately
    # skips the root, which left the shipped binary unverified until release day.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Wails CLI binary
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: wails-cli-${{ runner.os }}-v2.13.0
      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build
        run: wails build -platform windows/amd64 -clean
      # wails build regenerates frontend/wailsjs. A diff here means the committed
      # bindings had drifted from app.go — the failure mode CLAUDE.md warns about.
      - name: Committed bindings match the Go source
        shell: bash
        run: |
          if ! git diff --quiet -- frontend/wailsjs; then
            echo "::error::frontend/wailsjs is out of date. Run 'wails generate module' and commit the result."
            git diff --stat -- frontend/wailsjs
            exit 1
          fi

  security:
    name: Security scan (CVE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Go vulnerability database check — reports known CVEs in dependencies that
      # are actually reachable from the backend code. Fails the job on findings.
      - name: govulncheck (Go CVEs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./backend/...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm audit is advisory (transitive dev deps are often noisy) so it reports
      # high/critical issues without failing the pipeline.
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
