name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      # Only the backend packages are built/tested in CI. The root package pulls
      # in Wails (webkit2gtk/CGO desktop deps) which isn't available on a headless
      # Linux runner — that's exercised by the Windows release build instead.
      - name: Build
        run: go build ./backend/...
      - name: Vet
        run: go vet ./backend/...
      - name: Test
        run: go test ./backend/...
        env:
          CGO_ENABLED: '1'

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
