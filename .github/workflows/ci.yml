name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go build & test
    # Runs on Windows: the CLI runners use Windows-only syscall.SysProcAttr fields
    # (HideWindow/CreationFlags), so the backend only compiles on Windows. SQLite
    # uses modernc.org/sqlite (pure Go), so no CGO/gcc is required.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./backend/...
      - name: Vet
        run: go vet ./backend/...
      - name: Test
        run: go test ./backend/...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  security:
    name: Security scan (CVE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Go vulnerability database check — reports known CVEs in dependencies that
      # are actually reachable from the backend code. Fails the job on findings.
      - name: govulncheck (Go CVEs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./backend/...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm audit is advisory (transitive dev deps are often noisy) so it reports
      # high/critical issues without failing the pipeline.
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
